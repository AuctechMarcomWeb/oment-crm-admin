# Oment on one VPS — frontend + backend on the same domain.
# Frontend files in /var/www/oment-frontend, backend (npm start) on port 5000.
# With this setup set in config.js:   window.OMENT_API_BASE = '/api';
# and in the backend .env:            APP_URL=https://oment.yourdomain.com
#                                     CORS_ORIGIN=https://oment.yourdomain.com
# HTTPS: run  sudo certbot --nginx -d oment.yourdomain.com  after this works on port 80.

server {
    listen 80;
    server_name oment.yourdomain.com;

    root /var/www/oment-frontend;
    index index.html;

    # backend API
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 12m;         # task files / attachments (JSON_LIMIT is 10mb)
    }

    location = /config.js { add_header Cache-Control "no-cache"; }

    # /admin → /admin/ , /employee → /employee/
    location = /admin    { return 301 /admin/; }
    location = /employee { return 301 /employee/; }

    location / {
        try_files $uri $uri/ =404;
    }
}
